# SpecBuilder CI — GitLab CI
# Blocks MRs if implementation changes without corresponding spec updates.

spec-drift:
  stage: test
  script:
    - pip install -e .
    - python3 -m specbuilder ci --check-drift --base=origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME --format=gitlab
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

