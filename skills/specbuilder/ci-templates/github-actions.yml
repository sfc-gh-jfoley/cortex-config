# SpecBuilder CI — GitHub Actions
# Blocks PRs if implementation changes without corresponding spec updates.
# Promotes draft specs to accepted after merge to main.

name: Spec Drift Check
on: [pull_request]

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install specbuilder
        run: pip install -e .
      - name: Check for spec drift
        run: python3 -m specbuilder ci --check-drift --base=origin/${{ github.base_ref }} --format=github

